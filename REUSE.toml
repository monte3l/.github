# REUSE (https://reuse.software) annotations. Files here carry no inline SPDX
# header, so this file records their copyright and license; `reuse lint`
# checks it in CI (.github/workflows/reuse.yml). The design/ directory is the
# vendored tier of m3l-design: a verbatim copy of a release, with its fonts
# under their own license.
version = 1
SPDX-PackageName = "monte3l/.github"
SPDX-PackageSupplier = "monte3l"
SPDX-PackageDownloadLocation = "https://github.com/monte3l/.github"

[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2026 Enrico Lionello"
SPDX-License-Identifier = "MIT"

# The vendored design system is the m3l-design authors' work, copied verbatim
# from a release.
[[annotations]]
path = ["design/source/**", "design/tokens.css", "design/SHA256SUMS"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 Enrico Lionello (enri3l) and Giulia Montevecchi (giulmonte), monte3l"
SPDX-License-Identifier = "MIT"

# The two vendored font files and their license texts are not monte3l's own
# work: they ship under the Atkinson Hyperlegible OFL-1.1 terms. The texts stay
# in design/source/licenses/, where a re-sync from m3l-design puts them.
[[annotations]]
path = ["design/source/fonts/**", "design/source/licenses/**"]
precedence = "override"
SPDX-FileCopyrightText = ["Copyright 2020-2024 The Atkinson Hyperlegible Next Project Authors", "Copyright 2020-2024 The Atkinson Hyperlegible Mono Project Authors"]
SPDX-License-Identifier = "OFL-1.1"

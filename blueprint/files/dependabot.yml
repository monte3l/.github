# Starting point for .github/dependabot.yml. Dependabot config is never
# inherited from the org, so each repository keeps its own copy. Keep the
# github-actions entry; add one npm entry per directory that holds a lockfile.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    # A freshly published action version is the window an attacker needs;
    # the default cooldown of 0 leaves it open.
    cooldown:
      default-days: 7
    labels:
      - dependencies


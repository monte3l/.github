# Starting point for a repository that vendors m3l-design. Replace the
# placeholders, then add one [[annotations]] entry per path that cannot carry
# an inline SPDX header. `reuse lint` must pass (workflow-templates/reuse.yml).
version = 1
SPDX-PackageName = "REPOSITORY"
SPDX-PackageSupplier = "monte3l"
SPDX-PackageDownloadLocation = "https://github.com/monte3l/REPOSITORY"

# The design system's own files, copied verbatim from a release: same owner
# and license as the rest of the repository. Never hand-edit them.
[[annotations]]
path = ["design/source/**", "design/tokens.css", "design/SHA256SUMS", "design/README.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright the monte3l contributors"
SPDX-License-Identifier = "MIT"

# The vendored fonts and their license texts are a separate case: they are not
# monte3l's own work and ship under the Atkinson Hyperlegible OFL-1.1 terms.
# Keep the license texts in design/source/licenses/, where a re-sync puts them,
# and copy OFL-1.1 into LICENSES/ so `reuse lint` finds it.
[[annotations]]
path = ["design/source/fonts/**", "design/source/licenses/**"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2020-2024 The Atkinson Hyperlegible Next Project Authors, Copyright 2020-2024 The Atkinson Hyperlegible Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

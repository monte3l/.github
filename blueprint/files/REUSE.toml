# Starting point for a repository that vendors m3l-design. Replace the
# placeholders, then add one [[annotations]] entry per path that cannot carry
# an inline SPDX header. `reuse lint` must pass (workflow-templates/reuse.yml).
# Register the repository at https://api.reuse.software/register so the README's
# REUSE badge resolves.
version = 1
SPDX-PackageName = "REPOSITORY"
SPDX-PackageSupplier = "monte3l"
SPDX-PackageDownloadLocation = "https://github.com/monte3l/REPOSITORY"

# Everything without an inline header. `aggregate` lets a more specific table
# below add to this one, and `.bestpractices.json` and the rest need no entry
# of their own.
[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2026 Enrico Lionello (enri3l) and Giulia Montevecchi (giulmonte), monte3l"
SPDX-License-Identifier = "MIT"

# The vendored design system (design/source/**, design/tokens.css and
# design/SHA256SUMS) is monte3l's own work copied verbatim from an m3l-design
# release. Never hand-edit it.
[[annotations]]
path = ["design/source/**", "design/tokens.css", "design/SHA256SUMS"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 Enrico Lionello (enri3l) and Giulia Montevecchi (giulmonte), monte3l"
SPDX-License-Identifier = "MIT"

# The vendored fonts and their license texts are not monte3l's own work: they
# ship under the Atkinson Hyperlegible OFL-1.1 terms. Keep the license texts in
# design/source/licenses/, where a re-sync puts them, and copy OFL-1.1 into
# LICENSES/ so `reuse lint` finds it.
[[annotations]]
path = ["design/source/fonts/**", "design/source/licenses/**"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2020-2024 The Atkinson Hyperlegible Next Project Authors, Copyright 2020-2024 The Atkinson Hyperlegible Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# The MONTE3L logo and the files made from it arrive with design/source/brand/.
# They are the organization's identity, not MIT: all rights reserved apart from
# the permissions in design/source/brand/LICENSE.md. This table comes last and
# overrides the MIT table for design/source/** above. The folder's README.md and
# LICENSE.md are documentation and stay MIT. Copy LicenseRef-MONTE3L-Brand.txt
# into LICENSES/ too.
[[annotations]]
path = [
  "design/source/brand/logo/**",
  "design/source/brand/favicon/**",
  "design/source/brand/github/**",
  "design/source/brand/social/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Enrico Lionello (enri3l), Giulia Montevecchi (giulmonte), monte3l"
SPDX-License-Identifier = "LicenseRef-MONTE3L-Brand"

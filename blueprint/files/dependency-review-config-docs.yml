# Starting point for .github/dependency-review-config.yml in a repository with a
# docs site, read by workflow-templates/dependency-review.yml (the action's
# `config-file` input). The allowed licenses are in the workflow.
#
# Per-package, not per-license: wrangler (tools/deploy) pulls in sharp's
# prebuilt libvips binaries, which carry LGPL-3.0-or-later. They are only
# installed (--ignore-scripts) in a CI job that uploads static HTML to
# Cloudflare, never shipped to anyone. Add another exemption only for a tool the
# project runs but never ships, after checking that it can accept the terms.
allow-dependencies-licenses:
  - pkg:npm/%40img/sharp-libvips-darwin-arm64
  - pkg:npm/%40img/sharp-libvips-darwin-x64
  - pkg:npm/%40img/sharp-libvips-linux-arm
  - pkg:npm/%40img/sharp-libvips-linux-arm64
  - pkg:npm/%40img/sharp-libvips-linux-ppc64
  - pkg:npm/%40img/sharp-libvips-linux-riscv64
  - pkg:npm/%40img/sharp-libvips-linux-s390x
  - pkg:npm/%40img/sharp-libvips-linux-x64
  - pkg:npm/%40img/sharp-libvips-linuxmusl-arm64
  - pkg:npm/%40img/sharp-libvips-linuxmusl-x64
  - pkg:npm/%40img/sharp-wasm32
  - pkg:npm/%40img/sharp-win32-arm64
  - pkg:npm/%40img/sharp-win32-ia32
  - pkg:npm/%40img/sharp-win32-x64

# Area labels for .github/workflows/labeler.yml (actions/labeler). The four
# shared labels come from blueprint/files/labeler.yml; the rest are specific to
# this repository and were created by hand in the neutral colour.

"area:ci":
  - changed-files:
      - any-glob-to-any-file: [".github/**", "lefthook.yml"]

"area:docs":
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "*.md", "docs.config.mjs"]

"area:design":
  - changed-files:
      - any-glob-to-any-file: ["design/**"]

"area:harness":
  - changed-files:
      - any-glob-to-any-file: [".claude/**"]

"area:blueprint":
  - changed-files:
      - any-glob-to-any-file: ["blueprint/**", "bin/**"]

"area:templates":
  - changed-files:
      - any-glob-to-any-file: ["workflow-templates/**"]

"area:community":
  - changed-files:
      - any-glob-to-any-file: ["profile/**"]

name: Feature request
description: Suggest a change or an addition
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you can't do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behavior you expect, and any alternatives you considered
    validations:
      required: true

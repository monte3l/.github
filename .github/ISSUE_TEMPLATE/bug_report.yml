name: Bug report
description: Something is broken, or behaves differently from what the docs say
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this. Exact steps are the fastest way to a fix.

        If you think it is a security vulnerability, please do not open an issue. Use private vulnerability reporting on the repository's Security tab instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release or commit you are running
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran, and what you ran them against
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: The error message or output, if there is one
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Your setup
      description: Operating system, runtime versions and anything else that might matter

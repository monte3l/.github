name: Project backfill (Scheduled)

# What this does: once a week, adds every open issue of the organization's
# repositories to the org Project "monte3l roadmap" (`bin/project-backfill.sh`).
# An issue form adds a new issue to the Project only when the person filing it
# can write to the Project, so a report from outside the org is left off the
# board. The Project's own auto-add rule covers one repository on the Free plan.
# This fills in what both miss. It adds, and never removes or edits an item.
#
# This repository is public, so the log and the job summary carry counts only:
# never a repository name or an issue URL.
#
# The `monte3l-planning` App has Projects write and Issues read. Its key lives in
# the `project-backfill` environment (main only), and only the step that runs the
# script can see the token it mints. The Project's number is the repository
# variable `PLANNING_PROJECT_NUMBER`.
#
# A run by hand only counts, unless `dry_run` is turned off. A scheduled run adds.
on:
  schedule:
    # Monday 06:45 UTC, after the 06:15 workflow template sync.
    - cron: "45 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Count what would be added, and add nothing"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: project-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill the org Project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: project-backfill
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No `repositories:` on purpose: a new repository must be reached without
      # someone editing this file. zizmor's github-app audit flags that, so it is
      # ignored here and only here. The key sits in a main-only environment and
      # no other step sees the token.
      - name: Mint a token for the organization's Project and issues
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.PLANNING_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLANNING_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]
          permission-organization-projects: write
          permission-issues: read
          permission-metadata: read

      - name: Add the issues that are not on the Project
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          PROJECT: ${{ vars.PLANNING_PROJECT_NUMBER }}
          # A scheduled run has no inputs, so it adds. By hand, dry_run decides.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          flag=()
          [[ "$DRY_RUN" != "true" ]] || flag=(--dry-run)
          bin/project-backfill.sh "${flag[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

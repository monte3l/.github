name: Verify

# Checks what this repository ships: the docs site builds and its docs match
# the baseline script and the blueprint, every script parses and passes
# shellcheck, the tests in tests/ pass, every blueprint and workflow-template
# JSON file is valid, and every workflow (live and template) passes actionlint.
# The job name `verify` is what the org `main` ruleset requires.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The Node version comes from .node-version, the single source of truth.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Docs site builds, links resolve and docs match the blueprint
        run: node design/source/docs-kit/build.mjs --check

      - name: Script syntax and shellcheck
        run: |
          bash -n bin/apply-repo-baseline.sh bin/design-resync-pr.sh bin/pin-freshness.sh bin/org-audit.sh bin/upstream-watch.sh bin/template-sync-pr.sh bin/new-repo.sh bin/wt.sh bin/lib/upsert-issue.sh bin/lib/leftover-placeholders.sh bin/lib/docs-config-parity.sh bin/lib/release-pin-age.sh tests/new-repo.test.sh
          shellcheck bin/apply-repo-baseline.sh bin/design-resync-pr.sh bin/pin-freshness.sh bin/org-audit.sh bin/upstream-watch.sh bin/template-sync-pr.sh bin/new-repo.sh bin/wt.sh bin/lib/upsert-issue.sh bin/lib/leftover-placeholders.sh bin/lib/docs-config-parity.sh bin/lib/release-pin-age.sh tests/new-repo.test.sh
          node --check bin/knowledge-report.mjs
          node --check bin/bootstrap-render.mjs
          node --check bin/template-sync.mjs

      # The parity gates, the template classifier (hostile input included) and bin/new-repo.sh, run against
      # stubs and a local bare repository. They need git, jq and node, and create nothing outside a temporary
      # directory. Not covered: anything only a real GitHub answers, see the knowledge log.
      - name: Tests
        run: node --test "tests/*.test.mjs"

      - name: JSON files parse
        run: |
          find blueprint workflow-templates -name '*.json' -print0 \
            | xargs -0 -n1 jq empty

      - name: actionlint
        # Templates use `$default-branch`, which is valid text for actionlint.
        # Pinned by tag. Dependabot does not read this value: see blueprint/pins.json.
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color .github/workflows/*.yml workflow-templates/*.yml

name: Release finalize

# Reusable workflow: attests the assets on a DRAFT release, attaches the
# attestation's bundle to it, publishes it, then tells the repositories that
# consume it. Runs after `release-prepare.yml` and after any
# repository-specific job (npm publish, packaging) that attaches assets to the
# draft.
#
# Publish is the last step on purpose: with immutable releases on, publishing
# locks the tag and every asset for good, so everything must be on the draft
# first. A release with no assets is published as is, and then has an
# attestation only if immutable releases are on for the repository: GitHub
# attests an immutable release itself, and this workflow attests assets only.
#
# The caller job must grant `contents: write`, `id-token: write` and
# `attestations: write`, even with `attest: false`: a called job's permissions
# cannot be conditional on a step. A caller that attests on its own and only
# wants the publish should call `release-publish.yml`, which needs
# `contents: write` alone.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag of the draft release to publish
        type: string
        required: true
      checksums:
        description: Name of an asset holding sha256sum lines (for example SHA256SUMS) to attest instead of every asset
        type: string
        default: ""
      attest:
        description: Attest the assets on the draft and attach the bundle as <tag>.sigstore.json. Set false when the repository's own job already attested them and attached its own bundle before the draft is locked
        type: boolean
        default: true
      notify:
        description: JSON array of repository names (same owner) that receive a `release-published` dispatch
        type: string
        default: "[]"
    secrets:
      RELEASE_APP_CLIENT_ID:
        description: Client ID of the release App. Needed only when `notify` is not empty
        required: false
      RELEASE_APP_PRIVATE_KEY:
        description: Private key of the release App. Needed only when `notify` is not empty
        required: false

permissions: {}

jobs:
  publish:
    name: Attest and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-finalize-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # `gh release view <tag>` cannot see a draft, so find it by listing.
      - name: Find the draft and check its tag
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .id' | head -n 1)"
          if [[ -z "$id" ]]; then
            echo "No release for tag $TAG" >&2
            exit 1
          fi
          # A tag that points anywhere but the commit being released means
          # someone moved it or the release was cut from the wrong run.
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
          if [[ "$(jq -r .object.type <<<"$ref")" == "commit" && "$(jq -r .object.sha <<<"$ref")" != "$GITHUB_SHA" ]]; then
            echo "Tag $TAG does not point at $GITHUB_SHA" >&2
            exit 1
          fi
          echo "id=$id" >>"$GITHUB_OUTPUT"

      - name: Download the draft's assets
        id: assets
        if: inputs.attest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          mkdir assets
          count=0
          while IFS=$'\t' read -r asset_id name; do
            [[ -n "$asset_id" ]] || continue
            # A bundle left by an earlier run that failed before publishing is
            # not release content: attesting it would list a stale bundle.
            if [[ "$name" == *.sigstore.json ]]; then
              continue
            fi
            gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" >"assets/$(basename -- "$name")"
            count=$((count + 1))
          done < <(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.assets[] | [.id, .name] | @tsv')
          echo "count=$count" >>"$GITHUB_OUTPUT"

      - name: Attest every asset
        id: attest_all
        if: inputs.attest && steps.assets.outputs.count != '0' && inputs.checksums == ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/*

      - name: Attest the assets listed in the checksums file
        id: attest_sums
        if: inputs.attest && steps.assets.outputs.count != '0' && inputs.checksums != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: assets/${{ inputs.checksums }}

      # OpenSSF Scorecard's Signed-Releases check reads release assets only (a
      # `*.sigstore.json` file scores 8), never GitHub's attestation store, so
      # the bundle is attached to the draft as `<tag>.sigstore.json`. It goes up
      # before publishing, because an immutable release takes no new asset. It
      # is uploaded by release id, as a draft cannot be found by tag. A same-name
      # asset left by an earlier failed run is replaced, so a re-run works.
      - name: Attach the attestation bundle to the draft
        if: inputs.attest && steps.assets.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          TAG: ${{ inputs.tag }}
          BUNDLE: ${{ steps.attest_all.outputs.bundle-path || steps.attest_sums.outputs.bundle-path }}
        run: |
          if [[ -z "$BUNDLE" || ! -f "$BUNDLE" ]]; then
            echo "The attestation step produced no bundle" >&2
            exit 1
          fi
          name="${TAG//[^A-Za-z0-9._-]/-}.sigstore.json"
          old="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" |
            jq -r --arg n "$name" '.assets[] | select(.name == $n) | .id' | head -n 1)"
          if [[ -n "$old" ]]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
          fi
          gh api -X POST -H "Content-Type: application/json" --input "$BUNDLE" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" >/dev/null

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false >/dev/null

  # A release published with `GITHUB_TOKEN` fires no `release` event, so the
  # consumers are told with an explicit dispatch, sent as the App.
  notify:
    name: Notify ${{ matrix.repository }}
    needs: [publish]
    if: inputs.notify != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(inputs.notify) }}
    steps:
      - name: Mint a token for the consumer only
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repository }}
          permission-contents: write

      - name: Dispatch release-published
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET: ${{ matrix.repository }}
          TAG: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [[ ! "$TARGET" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Not a repository name: $TARGET" >&2
            exit 1
          fi
          gh api -X POST "repos/$OWNER/$TARGET/dispatches" \
            -f event_type=release-published \
            -f "client_payload[repository]=$GITHUB_REPOSITORY" \
            -f "client_payload[tag]=$TAG" \
            -f "client_payload[sha]=$GITHUB_SHA"

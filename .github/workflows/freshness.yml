name: Freshness (Scheduled)

# What this does, once a week, with one tracking issue per job:
#
# - `pins`: compares the hand-pinned tool versions in `blueprint/pins.json`
#   (GITLEAKS_VERSION, the actionlint image, zizmor) with the newest upstream
#   release that is at least seven days old. Dependabot only reads `uses:`, so
#   nothing else notices these. The run never edits a pin: a person bumps
#   `pins.json` and every copy, and `bin/pin-parity.mjs` (part of `verify`)
#   fails if one copy is missed.
# - `upstream`: compares the policies the standard follows (the OpenSSF
#   Scorecard checks, the OpenSSF Baseline, the OpenSSF Best Practices criteria,
#   the REUSE specification) with the values a person last reviewed in
#   `blueprint/upstream.json`. It never accepts a change: a person reads it,
#   updates `blueprint/` if the standard should follow, and runs
#   `bin/upstream-watch.sh --accept`.
# - `knowledge`: reports what in the `knowledge/` wiki needs a person: a page not
#   reviewed for 180 days, a source card no page cites, a citation that points
#   nowhere (`bin/knowledge-report.mjs`). It never edits a page, and a stale page
#   never blocks a merge: the build gate is `bin/knowledge-parity.mjs`.
# - `copies`: compares every consumer repository's copy of each workflow
#   template with the template (`bin/template-sync.mjs`), and reports a copy that
#   runs an older version of it. A copy a person changed on purpose is left
#   alone and never reported. It reads public files and changes nothing.
#
# A run fails only when it cannot check; a finding is reported by its issue.
on:
  schedule:
    # Monday 05:15 UTC, ahead of the other weekly Monday jobs.
    - cron: "15 5 * * 1"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: freshness
  cancel-in-progress: false

jobs:
  pins:
    name: Pinned tool versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # the tracking issue is the only write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compare pins with upstream and update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          code=0
          bin/pin-freshness.sh >"$RUNNER_TEMP/pins.txt" || code=$?
          cat "$RUNNER_TEMP/pins.txt" >>"$GITHUB_STEP_SUMMARY"
          case "$code" in
            0) bin/lib/upsert-issue.sh "Pinned tool versions are stale" dependencies "$RUNNER_TEMP/pins.txt" --clean ;;
            1)
              {
                cat <<'TEXT'
          These hand-pinned versions are behind the newest release that is at least seven days old.

          ```text
          TEXT
                cat "$RUNNER_TEMP/pins.txt"
                cat <<'TEXT'
          ```

          Bump `blueprint/pins.json` and every file it lists in one pull request. `verify` fails if a copy is missed.
          TEXT
              } >"$RUNNER_TEMP/body.md"
              bin/lib/upsert-issue.sh "Pinned tool versions are stale" dependencies "$RUNNER_TEMP/body.md"
              ;;
            *) printf 'pin-freshness.sh failed with exit code %s\n' "$code" >&2; exit "$code" ;;
          esac

  upstream:
    name: Upstream policies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # the tracking issue is the only write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compare upstream policies with the reviewed values and update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          code=0
          bin/upstream-watch.sh >"$RUNNER_TEMP/upstream.txt" || code=$?
          cat "$RUNNER_TEMP/upstream.txt" >>"$GITHUB_STEP_SUMMARY"
          case "$code" in
            0) bin/lib/upsert-issue.sh "Upstream policy changed" area:ci "$RUNNER_TEMP/upstream.txt" --clean ;;
            1)
              {
                cat <<'TEXT'
          These upstream policies changed since they were last reviewed.

          ```text
          TEXT
                cat "$RUNNER_TEMP/upstream.txt"
                cat <<'TEXT'
          ```

          Read each change. If the standard should follow, update `blueprint/` (`affects` in `blueprint/upstream.json` says where). Then run `bin/upstream-watch.sh --accept NAME` and commit `blueprint/upstream.json` in the same pull request.
          TEXT
              } >"$RUNNER_TEMP/body.md"
              bin/lib/upsert-issue.sh "Upstream policy changed" area:ci "$RUNNER_TEMP/body.md"
              ;;
            *) printf 'upstream-watch.sh failed with exit code %s\n' "$code" >&2; exit "$code" ;;
          esac

  knowledge:
    name: Knowledge wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # the tracking issue is the only write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Report what needs review and update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          code=0
          node bin/knowledge-report.mjs >"$RUNNER_TEMP/knowledge.txt" || code=$?
          cat "$RUNNER_TEMP/knowledge.txt" >>"$GITHUB_STEP_SUMMARY"
          case "$code" in
            0) bin/lib/upsert-issue.sh "Knowledge wiki needs review" area:docs "$RUNNER_TEMP/knowledge.txt" --clean ;;
            1)
              {
                cat <<'TEXT'
          These parts of the knowledge base need a person to look at them.

          ```text
          TEXT
                cat "$RUNNER_TEMP/knowledge.txt"
                cat <<'TEXT'
          ```

          A stale page needs its sources read again, and then a new `reviewed` date. An orphan card needs a page that cites it, or its removal. A dead citation needs the card written or the citation fixed. Run `/knowledge lint` in Claude Code for help. Never change a date to clear this report.
          TEXT
              } >"$RUNNER_TEMP/body.md"
              bin/lib/upsert-issue.sh "Knowledge wiki needs review" area:docs "$RUNNER_TEMP/body.md"
              ;;
            *) printf 'knowledge-report.mjs failed with exit code %s\n' "$code" >&2; exit "$code" ;;
          esac

  copies:
    name: Workflow copies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # the tracking issue is the only write
    steps:
      # The whole history: the report needs every version the templates have had.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Compare the copies with the templates and update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          code=0
          node bin/template-sync.mjs --check --findings "$RUNNER_TEMP/findings.txt" >"$RUNNER_TEMP/copies.txt" || code=$?
          cat "$RUNNER_TEMP/copies.txt" >>"$GITHUB_STEP_SUMMARY"
          case "$code" in
            0) bin/lib/upsert-issue.sh "Workflow copies are behind their templates" area:ci "$RUNNER_TEMP/findings.txt" --clean ;;
            1)
              {
                cat <<'TEXT'
          These need a person to look at them. A copy behind its template runs an older version of it: the template has changed in behaviour since the copy was made. The full comparison is in the job summary of the run that wrote this.

          ```text
          TEXT
                cat "$RUNNER_TEMP/findings.txt"
                cat <<'TEXT'
          ```

          Refresh a stale copy from `workflow-templates/`. A copy a person changed on purpose is never reported, and neither is one that differs only in comments, blank lines or action pins. A flag that disagrees with a repository's `docs.config.mjs` is fixed in `blueprint/sync.json`.
          TEXT
              } >"$RUNNER_TEMP/body.md"
              bin/lib/upsert-issue.sh "Workflow copies are behind their templates" area:ci "$RUNNER_TEMP/body.md"
              ;;
            *) printf 'template-sync.mjs failed with exit code %s\n' "$code" >&2; exit "$code" ;;
          esac

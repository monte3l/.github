version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
    labels:
      - dependencies
  # Dependabot only reads .github/workflows for `/`. A non-root directory is
  # read directly (one level, *.yml), which is how the templates get covered.
  - package-ecosystem: github-actions
    directory: /workflow-templates
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
    labels:
      - dependencies
  # tools/deploy/ pins the exact wrangler version docs.yml installs,
  # through a committed lockfile. Its job holds a Cloudflare API token, so it
  # gets a one-day cooldown.
  - package-ecosystem: npm
    directory: /tools/deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    commit-message:
      prefix: ci
    labels:
      - dependencies
  # The same pin, as a starter: bin/new-repo.sh --docs copies blueprint/files/deploy-tools/ into a new
  # repository, lockfile included, so a new docs site starts on a reviewed wrangler and no `npm install`
  # runs at bootstrap. A bump here changes only what a repository created later copies.
  - package-ecosystem: npm
    directory: /blueprint/files/deploy-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    commit-message:
      prefix: ci
    labels:
      - dependencies
